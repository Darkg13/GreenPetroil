<article class="card">
  <div class="card-media card-media-alt" aria-hidden="true"></div>
  <div class="card-body">
    <p class="tag">{{ projeto().categoria }}</p>
    <h3>{{ projeto().nome }}</h3>
    <p>{{ projeto().descricao }}</p>
    <dl class="facts">
      <div>
        <dt>Local</dt>
        <dd>{{ projeto().local }}</dd>
      </div>
      <div>
        <dt>Pessoas beneficiadas</dt>
        <dd>{{ projeto().beneficiados | number }}</dd>
      </div>
    </dl>
  </div>
</article>
