<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="GreenPetroil, página inicial">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path class="brand-drop" d="M16 3c5 6 9 10.5 9 16a9 9 0 0 1-18 0C7 13.5 11 9 16 3z" />
        <path class="brand-vein" d="M16 12c-3 3-4.5 6-4.5 9 3 0 6-2 6-6.5" />
      </svg>
      <span>GreenPetroil</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="menu-principal"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      Menu
    </button>

    <gp-menu [aberto]="menuAberto()" (navegou)="fecharMenu()" />
  </div>
</header>
